spring.application.name=tracewise-ai

spring.datasource.url=jdbc:postgresql://localhost:5432/tracewise_ai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secretBase64=${JWT_SECRET_BASE64}

#springdoc.api-docs.path=/tracewise-ai-api-docs
#springdoc.swagger-ui.url=/tracewise-ai-api-docs